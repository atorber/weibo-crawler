<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff416c" />
      <stop offset="100%" stop-color="#ff4b2b" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffebee" stop-opacity="0.8" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#grad)" />
  <!-- Eye/Spider Radar Ring -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="4 3" opacity="0.6" />
  <!-- Weibo Eye Outer Shape -->
  <path d="M22 50 C28 32, 72 32, 78 50 C72 68, 28 68, 22 50 Z" fill="url(#glow)" />
  <!-- Iris -->
  <circle cx="50" cy="50" r="14" fill="#ff416c" />
  <!-- Pupil & Sparkle -->
  <circle cx="50" cy="50" r="7" fill="#ffffff" />
  <circle cx="54" cy="46" r="3" fill="#ffffff" />
  <!-- Crawler antennae / nodes -->
  <circle cx="76" cy="24" r="5" fill="#ffffff" opacity="0.9" />
  <line x1="62" y1="36" x2="73" y2="27" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="24" cy="76" r="5" fill="#ffffff" opacity="0.9" />
  <line x1="38" y1="64" x2="27" y2="73" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
</svg>
